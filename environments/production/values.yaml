# Pin production to an immutable image tag or digest before syncing.
image:
  repository: ""
  tag: ""

database:
  namespace: labk8stack-db-prod
  clusterName: labk8stack-db-prod
  appSecretName: labk8stack-db-connection

app:
  configSecretName: labk8stack-config
  namespacePrefix: lab-prod-u
  sandboxIdleDays: 30

ingress:
  enabled: false
