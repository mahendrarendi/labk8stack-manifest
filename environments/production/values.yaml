# Pin production to an immutable image digest before syncing.
image:
  repository: ghcr.io/mahendrarendi/labk8stack-app
  tag: ""
  digest: "sha256:622f9e9bd7cf4bf187e3f229bf59883d244ec4f833d461231622cc924444a418"

database:
  namespace: cnpg-system
  clusterName: labk8stack-pgcluster
  # Mirror the CNPG application Secret into the application namespace.
  # fqdn-uri resolves the RW Service across namespaces without rewriting it.
  appSecretName: labk8stack-pgcluster-app
  connectionSecretKey: fqdn-uri

app:
  configSecretName: labk8stack-config
  namespacePrefix: lab-prod-u
  sandboxIdleDays: 30

ingress:
  enabled: false

gateway:
  # Enable after the public Gateway has a labs-https listener and TLS Secret.
  enabled: false
  host: labs.mahendrarendi.cloud
  parentName: public-gateway
  parentNamespace: nginx-gateway
  sectionName: labs-https
