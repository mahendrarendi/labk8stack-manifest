# The first production release is pinned to a validated manifest commit.
# Update targetRevision to a new approved tag or commit for each later release.
# The Application is manual-sync by default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: labk8stack
  namespace: argocd
spec:
  project: labk8stack-production
  source:
    repoURL: https://github.com/mahendrarendi/labk8stack-manifest.git
    targetRevision: 991aed68df6907d255f5ece7e615c4de6367f691
    path: .
    helm:
      releaseName: labk8stack
      valueFiles:
        - environments/production/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: labk8stack
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
