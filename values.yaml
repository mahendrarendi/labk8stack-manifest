image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

database:
  # Namespace of the CNPG Cluster. Empty means the Helm release namespace.
  namespace: ""
  clusterName: ""
  # Secret must exist in the APPLICATION namespace. In the same namespace,
  # CNPG creates <clusterName>-app. Across namespaces, create/sync a local
  # Secret whose URI uses <clusterName>-rw.<db-namespace>.svc.cluster.local.
  appSecretName: ""
  connectionSecretKey: uri
  operatorNamespace: cnpg-system
  # Installed only when CNPG is in the same namespace as this Helm release.
  cnpgIngressPolicy: true

app:
  # Create this Secret outside Helm with SECRET_KEY. Do not commit its value.
  configSecretName: ""
  # Non-sensitive lab workload settings are stored in a chart-managed ConfigMap.
  challengeImage: registry.k8s.io/echoserver:1.10
  challengeGoodTags: "1.10,latest"
  namespacePrefix: lab-u
  sandboxIdleDays: 30
  sandboxGraceMinutes: 60
  leaderboardDays: 7

replicaCount: 2

availability:
  podDisruptionBudget: true

# Requires Kubernetes 1.30+ ValidatingAdmissionPolicy support. This blocks the
# provisioner ServiceAccount from changing resources outside its lab prefix.
admission:
  namespaceGuard: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

cleanup:
  schedule: "*/15 * * * *"

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""

gateway:
  enabled: false
  host: ""
  parentName: public-gateway
  parentNamespace: nginx-gateway
  sectionName: lab-https
