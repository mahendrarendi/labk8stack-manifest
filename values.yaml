image:
  repository: ""
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

database:
  # Namespace of the CNPG Cluster. Empty means the Helm release namespace.
  namespace: ""
  clusterName: ""
  # Secret must exist in the APPLICATION namespace. In the same namespace,
  # CNPG creates <clusterName>-app. Across namespaces, create/sync a local
  # Secret whose URI uses <clusterName>-rw.<db-namespace>.svc.cluster.local.
  appSecretName: ""
  connectionSecretKey: uri
  operatorNamespace: cnpg-system
  # Installed only when CNPG is in the same namespace as this Helm release.
  cnpgIngressPolicy: true

app:
  # Create this Secret outside Helm with SECRET_KEY, LAB_APP_IMAGE,
  # and LAB_APP_GOOD_TAGS. Do not commit its contents to Git.
  configSecretName: ""
  namespacePrefix: lab-u
  sandboxIdleDays: 30
  sandboxGraceMinutes: 60
  leaderboardDays: 7

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

cleanup:
  schedule: "*/15 * * * *"

ingress:
  enabled: false
  className: ""
  host: ""
  tlsSecretName: ""
