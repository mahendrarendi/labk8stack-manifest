apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "labk8stack.fullname" . }}-cleanup
  labels:
    {{- include "labk8stack.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "labk8stack.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: cleanup
        spec:
          serviceAccountName: {{ include "labk8stack.fullname" . }}
          restartPolicy: OnFailure
          {{- with .Values.image.pullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: {{ include "labk8stack.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["python", "-m", "app.cleanup", "--apply"]
              env:
                - name: KUBECONFIG
                  value: /etc/labk8stack/kubeconfig/config
                - name: LAB_MODE
                  value: kubernetes
                - name: LAB_NAMESPACE_PREFIX
                  value: {{ .Values.app.namespacePrefix | quote }}
                - name: LAB_SANDBOX_IDLE_DAYS
                  value: {{ .Values.app.sandboxIdleDays | quote }}
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "labk8stack.dbSecret" . }}
                      key: {{ .Values.database.connectionSecretKey }}
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: kubeconfig
                  mountPath: /etc/labk8stack/kubeconfig
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir: {}
            - name: kubeconfig
              configMap:
                name: {{ include "labk8stack.fullname" . }}-kubeconfig
