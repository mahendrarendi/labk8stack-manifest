apiVersion: v1
kind: Service
metadata:
  name: {{ include "labk8stack.fullname" . }}
  labels:
    {{- include "labk8stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "labk8stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
